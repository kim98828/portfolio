name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'backend.gs'
      - 'appsscript.json'
      - '.claspignore'
      - '.github/workflows/appsscript-deploy.yml'
  workflow_dispatch:

# 동시 배포 방지 (클라스프 push/deploy 충돌 회피)
concurrency:
  group: appsscript
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON secret 이 비어 있습니다. 로컬에서 'clasp login' 후 ~/.clasprc.json 내용을 등록하세요."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Generate .clasp.json
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$SCRIPT_ID" ]; then
            echo "::error::SCRIPT_ID secret 이 비어 있습니다."
            exit 1
          fi
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json

      - name: Push to Apps Script
        run: clasp push --force

      - name: Deploy (update existing deployment)
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::DEPLOYMENT_ID secret 이 비어 있습니다. 'clasp deployments' 로 기존 웹앱 배포 ID 를 확인해 등록하세요."
            exit 1
          fi
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "CI ${GITHUB_SHA}"
